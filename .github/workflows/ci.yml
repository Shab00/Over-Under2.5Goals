name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Prepare minimal SQLite DB
        run: |
          mkdir -p data
          python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("data/deliveries.db")
          cur = conn.cursor()
          cur.execute("""
          CREATE TABLE IF NOT EXISTS deliveries (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            match_id INTEGER NOT NULL,
            source TEXT,
            payload_json TEXT,
            ingested_at TEXT,
            received_at TEXT
          );
          """)
          conn.commit()
          conn.close()
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
          API_KEY: test-secret
        run: pytest -q
