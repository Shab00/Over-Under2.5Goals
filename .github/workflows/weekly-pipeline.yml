name: Weekly Pipeline

permissions:
  contents: write 

on:
  schedule:
    # Summer BST (UTC+1)
    - cron: '30 10 * * *'   # 11:30 BST → 1hr before 12:30
    - cron: '0 13 * * *'    # 14:00 BST → 1hr before 15:00
    - cron: '30 15 * * *'   # 16:30 BST → 1hr before 17:30
    - cron: '0 18 * * *'    # 19:00 BST → 1hr before 20:00
    - cron: '0 12 * * *'    # 13:00 BST → 1hr before 14:00 (Sunday)
    # Winter GMT (UTC+0)
    - cron: '30 11 * * *'   # 11:30 GMT → 1hr before 12:30
    - cron: '0 14 * * *'    # 14:00 GMT → 1hr before 15:00
    - cron: '30 16 * * *'   # 16:30 GMT → 1hr before 17:30
    - cron: '0 19 * * *'    # 19:00 GMT → 1hr before 20:00
    - cron: '0 13 * * *'    # 13:00 GMT → 1hr before 14:00 (Sunday)
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for matches within the next hour
        id: check
        run: python jobs/check_upcoming_matches.py

      - name: Run the full pipeline
        if: steps.check.outputs.should_run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN  }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash jobs/run_weekly_pipeline.sh

      - name: Archive snapshot
        if: steps.check.outputs.should_run == 'true'
        run: |
          mkdir -p snapshots/archive
          cp snapshots/predictions_latest.csv snapshots/archive/predictions_$(date -u +"%Y%m%dT%H%M%S").csv

      - name: Commit updated snapshot, results, and model accuracy
        if: steps.check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/predictions_latest.csv snapshots/archive/
          if [ -f data/processed/results_merged.csv ]; then
            git add data/processed/results_merged.csv
          fi
          # Add training metadata so the page shows the latest accuracy
          if [ -f artifacts/train_report.json ]; then
            git add artifacts/train_report.json
          fi
          if [ -f artifacts/strategy_latest.json ]; then
            git add artifacts/strategy_latest.json
          fi
          if [ -f artifacts/strategy_latest.md ]; then
            git add artifacts/strategy_latest.md
          fi
          if [ -f artifacts/match_context.json ]; then
            git add artifacts/match_context.json
          fi
          git add artifacts/strategy_archive/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update snapshot, results, and model accuracy [skip ci]"
            git push
          fi
