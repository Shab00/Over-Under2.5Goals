global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'app'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: /metrics

  - job_name: 'test-metrics'
    static_configs:
      - targets: ['localhost:9101']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['localhost:19093']

  # Persistent webhook receiver for smoke-test metric
  - job_name: 'webhook_receiver'
    static_configs:
      - targets: ['localhost:9000']
    metrics_path: /metrics
