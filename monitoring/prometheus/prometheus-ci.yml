global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    metrics_path: /metrics
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'webhook_receiver'
    metrics_path: /metrics
    static_configs:
      - targets: ['mock-receiver:9000']

  - job_name: 'mock_app'
    metrics_path: /metrics
    static_configs:
      - targets: ['mock-app:8000']
