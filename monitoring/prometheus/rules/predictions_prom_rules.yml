groups:
- name: predictions-api.rules
  rules:
  - alert: PredictionsIngestionErrorRateHigh
    expr: rate(api_ingestion_total{result="error"}[5m]) > 0.05
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "High ingestion error rate for Predictions API"
      description: "Ingestion error rate for the Predictions API is high (rate(api_ingestion_total{result=\"error\"}[5m]) > 0.05). Investigate application logs and recent deploys."

  - alert: PredictionsHighSkippedRatio
    expr: |
      (
        rate(api_ingestion_total{result="skipped"}[5m])
        /
        clamp_min(rate(api_ingestion_total[5m]), 1)
      ) > 0.5 and rate(api_ingestion_total[5m]) > 0.1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High skipped/persisted ratio for Predictions ingestion"
      description: "More than 50% of ingestion attempts are being skipped over the last 5m. Possible schema or deduplication issues."

  - alert: PredictionsApiDown
    expr: up{job="predictions-api"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Predictions API Down"
      description: "The predictions API target is down (up{job=\"predictions-api\"} == 0). Check service process and container."
