global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prom_rules.yml

scrape_configs:
  - job_name: 'app'
    static_configs:
      - targets: ['127.0.0.1:8000']
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
