global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 0s
  group_interval: 1m
  repeat_interval: 1h
  receiver: 'webhook'

receivers:
  - name: 'webhook'
    webhook_configs:
      - url: 'http://mock-receiver:9000/'
        send_resolved: true
  - name: 'dev-null'
    webhook_configs: []
