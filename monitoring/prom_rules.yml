groups:
- name: over-under-alerts
  rules:
  - alert: HighRequestErrorRate
    expr: |
      (
        sum(rate(http_requests_total{http_status=~"5.."}[5m]))
        /
        sum(rate(http_requests_total[5m]))
      ) > 0.01
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "High 5xx error rate (>1%)"
      description: "5xx error rate > 1% for 5 minutes."

  - alert: HighP95Latency
    expr: |
      histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, endpoint))
      > 0.5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High p95 latency"
      description: "p95 request latency > 500ms for 5 minutes."
