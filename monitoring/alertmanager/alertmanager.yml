global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  receiver: "webhook"    # make webhook the default receiver

receivers:
- name: "webhook"
  webhook_configs:
  - url: "http://host.docker.internal:9000/"   # webhook_receiver.py listens on 0.0.0.0:9000
    send_resolved: true

- name: "dev-null"
  # silent fallback receiver
  webhook_configs: []
